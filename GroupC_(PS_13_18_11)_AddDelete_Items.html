<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Group C – Add / Delete Items</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f0f2f5; padding: 30px; }
    h2 { text-align: center; margin-bottom: 20px; color: #1a1a2e; }
    section { background: white; border-radius: 10px; padding: 24px; margin-bottom: 30px; }
    .input-row { display: flex; gap: 10px; margin-bottom: 16px; }
    .input-row input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; outline: none; }
    .input-row input:focus { border-color: #6366f1; }
    .input-row button, .add-btn { padding: 10px 18px; background: #6366f1; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
    .input-row button:hover, .add-btn:hover { background: #4f46e5; }
    #msg { font-size: 13px; margin-bottom: 10px; }

    /* TO-DO */
    ul#todoList { list-style: none; display: flex; flex-direction: column; gap: 8px; }
    ul#todoList li { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border: 1px solid #ddd; border-radius: 6px; }
    ul#todoList li.done { text-decoration: line-through; color: #aaa; background: #f9f9f9; }
    .del-btn { background: #ef4444; color: white; border: none; border-radius: 5px; padding: 4px 10px; cursor: pointer; font-size: 12px; }
    #counter { font-size: 12px; color: #888; margin-bottom: 10px; }

    /* NOTES */
    textarea#noteInput { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; resize: vertical; min-height: 80px; margin-bottom: 10px; outline: none; }
    textarea#noteInput:focus { border-color: #6366f1; }
    .notes-grid { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
    .note-card { background: #FAEEDA; border-radius: 8px; padding: 12px; width: 180px; position: relative; font-size: 13px; }
    .note-card .del-btn { position: absolute; top: 6px; right: 6px; padding: 2px 7px; }

    /* SHOPPING CART */
    .cart-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 8px; }
    .cart-item .item-name { font-weight: bold; flex: 1; }
    .qty-controls { display: flex; align-items: center; gap: 8px; }
    .qty-btn { width: 28px; height: 28px; border: 1px solid #6366f1; background: white; color: #6366f1; border-radius: 5px; font-size: 16px; cursor: pointer; }
    .qty-btn:hover { background: #6366f1; color: white; }
    .qty { font-weight: bold; width: 24px; text-align: center; }
    .item-price { font-weight: bold; color: #6366f1; min-width: 70px; text-align: right; }
    .total-row { text-align: right; font-size: 16px; font-weight: bold; padding-top: 10px; border-top: 1px solid #eee; margin-top: 10px; }
  </style>
</head>
<body>

<!-- ══ SECTION 1: TO-DO LIST (PS 13) ══ -->
<h2>To-Do List</h2>
<section>
  <div class="input-row">
    <input type="text" id="todoInput" placeholder="Add a new task...">
    <button onclick="addTask()">Add</button>
  </div>
  <div id="counter">0 tasks remaining</div>
  <div id="msg"></div>
  <ul id="todoList"></ul>
</section>

<!-- ══ SECTION 2: NOTES APP (PS 18 — with localStorage) ══ -->
<h2>Notes App</h2>
<section>
  <textarea id="noteInput" placeholder="Write a note..."></textarea>
  <button class="add-btn" onclick="addNote()">Add Note</button>
  <div class="notes-grid" id="notesGrid"></div>
</section>

<!-- ══ SECTION 3: SHOPPING CART (PS 11) ══ -->
<h2>Shopping Cart</h2>
<section>
  <div id="cartItems"></div>
  <div class="total-row">Total: ₹<span id="cartTotal">0</span></div>
</section>

<script>
  // ══════════════════════════════════════
  // SECTION 1 — TO-DO LIST
  // ══════════════════════════════════════
  let tasks = [];

  function addTask() {
    const input = document.getElementById('todoInput');
    const text = input.value.trim();
    if (text === '') {
      document.getElementById('msg').innerHTML = "<span style='color:red'>Please enter a task!</span>";
      return;
    }
    document.getElementById('msg').innerHTML = '';
    tasks.push({ text, done: false });
    input.value = '';
    renderTasks();
  }

  function toggleTask(index) {
    tasks[index].done = !tasks[index].done;
    renderTasks();
  }

  function deleteTask(index) {
    tasks.splice(index, 1);
    renderTasks();
  }

  function renderTasks() {
    const list = document.getElementById('todoList');
    list.innerHTML = '';
    tasks.forEach((task, i) => {
      const li = document.createElement('li');
      li.className = task.done ? 'done' : '';
      li.innerHTML = `
        <span onclick="toggleTask(${i})" style="cursor:pointer;flex:1">${task.text}</span>
        <button class="del-btn" onclick="deleteTask(${i})">Delete</button>`;
      list.appendChild(li);
    });
    const remaining = tasks.filter(t => !t.done).length;
    document.getElementById('counter').textContent = `${remaining} task${remaining !== 1 ? 's' : ''} remaining`;
  }

  // Enter key to add task
  document.getElementById('todoInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') addTask();
  });

  // ══════════════════════════════════════
  // SECTION 2 — NOTES APP (localStorage)
  // ══════════════════════════════════════
  function addNote() {
    const text = document.getElementById('noteInput').value.trim();
    if (!text) return;
    const notes = JSON.parse(localStorage.getItem('notes') || '[]');
    notes.push(text);
    localStorage.setItem('notes', JSON.stringify(notes));
    document.getElementById('noteInput').value = '';
    renderNotes();
  }

  function deleteNote(index) {
    const notes = JSON.parse(localStorage.getItem('notes') || '[]');
    notes.splice(index, 1);
    localStorage.setItem('notes', JSON.stringify(notes));
    renderNotes();
  }

  function renderNotes() {
    const notes = JSON.parse(localStorage.getItem('notes') || '[]');
    const grid = document.getElementById('notesGrid');
    grid.innerHTML = '';
    notes.forEach((note, i) => {
      grid.innerHTML += `
        <div class="note-card">
          <button class="del-btn" onclick="deleteNote(${i})">✕</button>
          ${note}
        </div>`;
    });
  }

  renderNotes(); // Load saved notes on page load

  // ══════════════════════════════════════
  // SECTION 3 — SHOPPING CART
  // ══════════════════════════════════════
  const cartData = [
    { name: 'JavaScript Book', price: 350, qty: 1 },
    { name: 'Wireless Mouse', price: 750, qty: 1 },
    { name: 'USB Hub', price: 499, qty: 1 },
  ];

  function changeQty(index, delta) {
    cartData[index].qty = Math.max(0, cartData[index].qty + delta);
    renderCart();
  }

  function renderCart() {
    const container = document.getElementById('cartItems');
    container.innerHTML = '';
    let total = 0;
    cartData.forEach((item, i) => {
      const itemTotal = item.price * item.qty;
      total += itemTotal;
      container.innerHTML += `
        <div class="cart-item">
          <span class="item-name">${item.name}</span>
          <div class="qty-controls">
            <button class="qty-btn" onclick="changeQty(${i}, -1)">−</button>
            <span class="qty">${item.qty}</span>
            <button class="qty-btn" onclick="changeQty(${i}, +1)">+</button>
          </div>
          <span class="item-price">₹${itemTotal}</span>
        </div>`;
    });
    document.getElementById('cartTotal').textContent = total;
  }

  renderCart(); // Load cart on start
</script>
</body>
</html>
